repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock
        entry: uv lock
        language: system
        files: ^(uv\.lock|pyproject\.toml)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ty-check
        name: ty check
        entry: uv run ty check --output-format concise --no-progress
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: plugin-typecheck
        name: plugin typecheck
        entry: bash -c 'cd plugin && bunx tsc --noEmit'
        language: system
        files: ^plugin/
        pass_filenames: false

      - id: plugin-bundle
        name: plugin bundle up to date
        entry: make plugin
        language: system
        files: ^(plugin/|pyproject\.toml$|src/amplifier_app_opencode/plugin_bundle/)
        pass_filenames: false
