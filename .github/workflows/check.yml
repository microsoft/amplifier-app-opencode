name: Check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The end-to-end suites need Docker and provider keys; they run locally with `make e2e`.
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c84232ca4fde9b022e20a930bfbbecd386b56fdf
        with:
          version: "0.12.2"
          python-version: "3.12"
          cache-dependency-glob: uv.lock
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.2"
      - name: Lint, type check, and confirm the plugin bundle is up to date
        run: make check
      - name: Unit tests
        run: make test
