[project]
name = "amplifier-app-opencode"
version = "0.4.0"
description = "Launch the opencode TUI with auto-discovered amplifier-agent models — checks/starts the chat-completions server, queries /v1/models, writes opencode.json, exec's opencode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amplifier" }]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
]

[project.scripts]
amplifier-opencode = "amplifier_app_opencode.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  # Lint and format. `make check` and `make fmt` are the local gate; there is no
  # CI in this repo, so the gate has to be runnable from a clean checkout.
  "ruff>=0.9",
  # AI-user judge. Uses Anthropic native structured outputs (output_config.format),
  # which is GA in recent SDKs; pinned to a version verified to support it. judge.py
  # falls back to httpx (a runtime dep) when `anthropic` is not importable.
  "anthropic>=0.117",
]

[tool.pytest.ini_options]
markers = [
  "dtu: DTU-based end-to-end tests requiring amplifier-digital-twin",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_app_opencode"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
