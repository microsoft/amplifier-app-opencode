[project]
name = "amplifier-app-opencode-e2e"
version = "0"
description = "End-to-end tests for amplifier-app-opencode in a Digital Twin Universe"
requires-python = ">=3.13"
dependencies = [
  "digital-twin-universe @ git+https://github.com/microsoft/amplifier-smart-tool-digital-twin-universe@4dda28bebfa47a6db7b53b803b4f16778c5ea91d",
  "pytest>=9,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -p no:cacheprovider"
pythonpath = ["."]
